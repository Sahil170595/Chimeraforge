[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimeraforge-installed-fixture"
version = "1.0.0"
requires-python = ">=3.10"
description = "Test-only CPU backend for Chimeraforge entry-point acceptance"

[project.entry-points."chimeraforge.backends"]
installed-cpu = "installed_cpu_backend:InstalledCPUBackend"

[tool.setuptools]
py-modules = ["installed_cpu_backend"]
