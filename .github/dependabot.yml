# Keeps the two things CI depends on from silently rotting: the actions in the
# workflows (a pinned major can go unmaintained) and the Python dev/runtime deps.
# Grouped so a routine bump is one PR to review, not eight.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The composite action pins actions of its own; Dependabot needs it listed
  # separately because it does not recurse into action directories.
  - package-ecosystem: github-actions
    directory: "/.github/actions/plan-comment"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The MCP server targets `mcp.server.fastmcp.FastMCP`, which mcp 2.0 moved.
      # Worse, the only test that would catch it guards on importorskip, so a 2.x
      # bump SKIPS that test and CI stays green while the [mcp] extra is broken.
      # Major bumps here must follow a deliberate port, not a dependency PR.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
