name: Locked CI environment
description: Install the supported interpreter and hash-locked CI dependencies.
inputs:
  python-version:
    description: Supported Python interpreter.
    default: "3.12"
  sync:
    description: Install the locked project environment.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.23"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked --all-extras
