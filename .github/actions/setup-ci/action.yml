name: Locked CI environment
description: Install the supported interpreter and hash-locked CI dependencies.
inputs:
  python-version:
    description: Supported Python interpreter.
    default: "3.12"
  sync:
    description: Install the locked project environment.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.23"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked --all-extras
