name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: uv run --no-sync ruff check src/chimeraforge scripts/ci_*.py scripts/check_coverage.py tests/test_ci_*.py tests/test_planner_properties.py
      - run: uv run --no-sync ruff format --check src/chimeraforge scripts/ci_*.py scripts/check_coverage.py tests/test_ci_*.py tests/test_planner_properties.py
      - run: uv run --no-sync mypy

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflows with verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --no-sync pytest tests/ -q --tb=short
      - name: Validate deployment exports with actual host parsers
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          CHIMERAFORGE_DEPLOY_ACCEPTANCE: "1"
        run: uv run --no-sync pytest tests/test_deploy_acceptance.py -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: uv run --no-sync pytest tests/ -q --cov=chimeraforge --cov-branch --cov-report=term:skip-covered --cov-report=json
      - name: Enforce line and branch ratchets
        run: uv run --no-sync python scripts/check_coverage.py coverage.json --summary "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync twine check dist/*
      - name: Record distribution identities
        run: sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  installed:
    needs: build
    name: installed distributions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          sync: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Accept original and sdist-rebuilt wheels in isolated environments
        run: python scripts/ci_distributions.py

  docker:
    needs: build
    name: docker candidate (builds + calls MCP tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/setup-ci
        with:
          sync: "false"
      - name: Export hash-locked container dependencies
        run: |
          uv export --locked --extra mcp --extra bench --no-emit-project --output-file requirements-candidate.txt > /dev/null
          uv sync --locked --extra mcp --no-install-project
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: candidate
          push: false
          load: true
          tags: chimeraforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Candidate version and actual MCP calls
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          uv run --no-sync python scripts/probe_mcp_stdio.py --expect-version "$version" -- docker run --rm -i chimeraforge:ci

  properties-and-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: uv run --no-sync python scripts/ci_mutation_check.py

  cpu-serving:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          sync: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Install candidate with locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/chimeraforge-candidate
        run: |
          uv sync --locked --all-extras --no-install-project
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps dist/*.whl
      - name: Real CPU inference, streaming, benchmark, report and failure paths
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/chimeraforge-candidate
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/ci_cpu_serving.py --expect-version "$version" --checkout "$GITHUB_WORKSPACE"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: uv export --locked --all-extras --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
      - run: uv run --no-sync pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --cache-dir "$RUNNER_TEMP/pip-audit"

  consumer-action:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Prepare installed candidate
        id: candidate
        run: |
          uv export --locked --all-extras --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          echo "wheel=$(realpath dist/*.whl)" >> "$GITHUB_OUTPUT"
      - name: Accept candidate through the consumer action
        id: fits
        uses: ./.github/actions/plan-comment
        with:
          package-path: ${{ steps.candidate.outputs.wheel }}
          hardware: RTX 4090 24GB
          model-size: 3b
          budget: "1000"
          comment: "false"
          fail-on-no-fit: "true"
      - name: Reject a plan that cannot fit through the consumer action
        id: no-fit
        continue-on-error: true
        uses: ./.github/actions/plan-comment
        with:
          package-path: ${{ steps.candidate.outputs.wheel }}
          hardware: RTX 4090 24GB
          model-size: 3b
          budget: "0.000001"
          comment: "false"
          fail-on-no-fit: "true"
      - name: Require both observed action outcomes
        env:
          FITS: ${{ steps.fits.outputs.fits }}
          NO_FIT_OUTCOME: ${{ steps.no-fit.outcome }}
          NO_FIT: ${{ steps.no-fit.outputs.fits }}
        run: |
          test "$FITS" = true
          test "$NO_FIT_OUTCOME" = failure
          test "$NO_FIT" = false

  required:
    name: CI required
    if: always()
    needs: [lint, workflows, test, coverage, build, installed, docker, properties-and-mutations, cpu-serving, dependencies, consumer-action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          print(json.dumps({name: job["result"] for name, job in results.items()}, sort_keys=True))
          if failed:
              print(f"::error::Required validation failed: {failed}")
              sys.exit(1)
          PY
