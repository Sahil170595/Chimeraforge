name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          test "$TAG" = "$PKG"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chimeraforge/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mints the OIDC token mcp-publisher exchanges; no secrets
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The registry pins a server to a version that must already exist on PyPI,
      # so a stale server.json would list a release that cannot be verified.
      # Caught here rather than after publishing the wrong version.
      - name: Verify server.json matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV=$(python -c "import json;d=json.load(open('server.json'));print(d['version'])")
          PKG=$(python -c "import json;d=json.load(open('server.json'));print(d['packages'][0]['version'])")
          echo "tag=$TAG server.json=$SRV package=$PKG"
          test "$TAG" = "$SRV" && test "$TAG" = "$PKG"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      # Ownership is proved by the `mcp-name:` token in the README, which the
      # registry reads from the PyPI *description* -- so the release has to be
      # indexed before publishing. PyPI's CDN lags the upload by a few seconds.
      - name: Wait for the release to be visible on PyPI
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/chimeraforge/$TAG/json" >/dev/null 2>&1; then
              echo "chimeraforge $TAG is on PyPI"; exit 0
            fi
            echo "attempt $i: not indexed yet, waiting..."; sleep 10
          done
          echo "::error::chimeraforge $TAG never appeared on PyPI"; exit 1

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
