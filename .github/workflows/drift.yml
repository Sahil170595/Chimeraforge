name: Dependency drift

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: false

jobs:
  live-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Resolve current supported dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Detect upstream drift against the full suite and SDK boundary
        run: |
          python -m pip check
          python -m pytest tests/ -q
          python scripts/ci_mutation_check.py
          version=$(python -c "import chimeraforge; print(chimeraforge.__version__)")
          python scripts/probe_mcp_stdio.py --expect-version "$version" -- chimeraforge mcp
      - name: Audit the resolved environment
        run: python -m pip_audit --skip-editable --cache-dir "$RUNNER_TEMP/pip-audit"
